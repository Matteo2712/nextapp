<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NextApp</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f172a">
<link rel="apple-touch-icon" href="icon-192.png">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --bg:#0f172a; --bg2:#111c34; --card:#16233f; --card2:#1c2c4d;
  --text:#e8edf7; --muted:#8a97b3; --accent:#4f8cff; --accent2:#3a6fd6;
  --danger:#ff5c6c; --ok:#22c55e; --warn:#f5a524; --border:#233355;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{height:100%; margin:0;}
body{
  background:var(--bg); color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  padding-bottom:90px;
  overscroll-behavior-y:none;
}
#app{max-width:600px; margin:0 auto; padding:0 14px;}

/* HEADER */
header{
  position:sticky; top:0; z-index:20;
  display:flex; align-items:center; justify-content:space-between;
  padding:14px 14px; background:rgba(15,23,42,.92); backdrop-filter:blur(8px);
  border-bottom:1px solid var(--border);
  margin:0 -14px 14px -14px;
}
.app-name{font-weight:700; font-size:19px; letter-spacing:.3px;}
.user-box{display:flex; align-items:center; gap:8px; cursor:pointer; padding:6px 10px; border-radius:20px; background:var(--card);}
.dot{width:9px; height:9px; border-radius:50%; background:var(--ok); box-shadow:0 0 6px var(--ok);}
.dot.off{background:#666; box-shadow:none;}
.user-email{font-size:12.5px; color:var(--muted); max-width:150px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}

/* LOGIN */
#loginScreen{display:none; flex-direction:column; gap:12px; max-width:340px; margin:15vh auto 0; padding:24px;}
#loginScreen h1{text-align:center; margin-bottom:6px;}
#loginScreen input{
  background:var(--card); border:1px solid var(--border); color:var(--text);
  padding:12px 14px; border-radius:10px; font-size:15px;
}
#loginScreen button{
  background:var(--accent); color:#fff; border:none; padding:12px; border-radius:10px;
  font-size:15px; font-weight:600; cursor:pointer;
}
#loginScreen .swap{background:none; color:var(--accent); font-weight:500; padding:6px;}
#loginError{color:var(--danger); font-size:13px; min-height:16px; text-align:center;}

/* LIST */
.section-title{font-size:13px; color:var(--muted); text-transform:uppercase; letter-spacing:.6px; margin:18px 0 8px 4px;}
.event-card{
  background:var(--card); border:1px solid var(--border); border-radius:14px;
  padding:14px 16px; margin-bottom:10px; display:flex; align-items:center; justify-content:space-between; gap:10px;
}
.event-main{min-width:0;}
.event-name{font-weight:600; font-size:16px; margin-bottom:3px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.event-date{font-size:12.5px; color:var(--muted);}
.event-countdown{
  text-align:right; flex-shrink:0; font-weight:700; font-size:15px; padding:6px 10px;
  border-radius:10px; background:var(--card2); white-space:nowrap;
}
.event-countdown.urgent{color:var(--warn); background:#3a2c14;}
.event-countdown.overdue{color:var(--danger); background:#3a1c22;}
.event-actions{display:flex; gap:4px;}
.icon-btn{
  background:none; border:none; color:var(--muted); cursor:pointer; padding:6px;
  border-radius:8px; display:flex; align-items:center; justify-content:center;
}
.icon-btn:active{background:var(--card2);}
.empty-state{text-align:center; color:var(--muted); padding:60px 20px; font-size:14px;}

/* FAB */
.fab{
  position:fixed; right:20px; bottom:24px; width:58px; height:58px; border-radius:50%;
  background:var(--accent); color:#fff; border:none; font-size:30px; font-weight:400;
  box-shadow:0 6px 18px rgba(79,140,255,.45); cursor:pointer; z-index:30;
  display:flex; align-items:center; justify-content:center;
}
.fab:active{transform:scale(.94);}

/* MODAL / SHEET */
.overlay{
  position:fixed; inset:0; background:rgba(0,0,0,.55); z-index:50;
  display:none; align-items:flex-end; justify-content:center;
}
.overlay.show{display:flex;}
.sheet{
  background:var(--bg2); width:100%; max-width:600px; border-radius:18px 18px 0 0;
  padding:20px; padding-bottom:calc(24px + env(safe-area-inset-bottom));
  animation:slideUp .18s ease-out;
}
@keyframes slideUp{from{transform:translateY(30px); opacity:0;} to{transform:translateY(0); opacity:1;}}
.sheet h2{margin:0 0 16px 0; font-size:18px;}
.sheet label{display:block; font-size:12.5px; color:var(--muted); margin:12px 0 5px;}
.sheet input{
  width:100%; background:var(--card); border:1px solid var(--border); color:var(--text);
  padding:12px 14px; border-radius:10px; font-size:15px;
}
.sheet-actions{display:flex; gap:10px; margin-top:20px;}
.sheet-actions button{flex:1; padding:13px; border-radius:10px; border:none; font-size:15px; font-weight:600; cursor:pointer;}
.btn-primary{background:var(--accent); color:#fff;}
.btn-secondary{background:var(--card); color:var(--text); border:1px solid var(--border) !important;}
.btn-danger{background:var(--danger); color:#fff;}

/* USER MENU SHEET */
.menu-item{
  display:flex; align-items:center; gap:12px; padding:14px 6px; font-size:15px;
  border-bottom:1px solid var(--border); cursor:pointer;
}
.menu-item:last-child{border-bottom:none;}
.menu-item.danger{color:var(--danger);}

/* TOAST */
#toast{
  position:fixed; left:50%; bottom:100px; transform:translateX(-50%) translateY(20px);
  background:#23324f; color:#fff; padding:12px 16px; border-radius:12px; display:flex; gap:14px;
  align-items:center; font-size:14px; opacity:0; pointer-events:none; transition:all .25s; z-index:60;
  box-shadow:0 6px 20px rgba(0,0,0,.35);
}
#toast.show{opacity:1; transform:translateX(-50%) translateY(0); pointer-events:auto;}
#toast button{background:none; border:none; color:var(--accent); font-weight:700; cursor:pointer; font-size:14px;}

.hidden{display:none !important;}
#fileImportInput{display:none;}
.badge-trash{font-size:11px; color:var(--muted); background:var(--card2); padding:2px 7px; border-radius:8px; margin-left:6px;}
</style>
</head>
<body>

<div id="loginScreen">
  <h1>NextApp</h1>
  <div id="loginError"></div>
  <input id="loginEmail" type="email" placeholder="Email" autocomplete="username">
  <input id="loginPass" type="password" placeholder="Password" autocomplete="current-password">
  <button id="loginBtn">Accedi</button>
  <button class="swap" id="swapToSignup">Non hai un account? Registrati</button>
</div>

<div id="app" class="hidden">
  <header>
    <div class="app-name">NextApp</div>
    <div class="user-box" id="userBox">
      <span class="dot" id="statusDot"></span>
      <span class="user-email" id="userEmail"></span>
    </div>
  </header>

  <div id="listContainer"></div>
</div>

<button class="fab" id="fabAdd">+</button>

<!-- Event form sheet -->
<div class="overlay" id="eventOverlay">
  <div class="sheet">
    <h2 id="eventFormTitle">Nuovo appuntamento</h2>
    <label>Nome</label>
    <input id="fName" type="text" placeholder="Es. Visita dentista">
    <label>Data</label>
    <input id="fDate" type="date">
    <label>Ora</label>
    <input id="fTime" type="time">
    <div class="sheet-actions">
      <button class="btn-secondary" id="eventCancelBtn">Annulla</button>
      <button class="btn-primary" id="eventSaveBtn">Salva</button>
    </div>
  </div>
</div>

<!-- User menu sheet -->
<div class="overlay" id="userMenuOverlay">
  <div class="sheet">
    <h2>Account</h2>
    <div class="menu-item" id="menuHistory">🗂️ Storico / Cestino</div>
    <div class="menu-item" id="menuExport">⬇️ Esporta CSV</div>
    <div class="menu-item" id="menuImport">⬆️ Importa CSV</div>
    <div class="menu-item danger" id="menuLogout">🚪 Esci</div>
    <div class="sheet-actions">
      <button class="btn-secondary" id="userMenuCloseBtn">Chiudi</button>
    </div>
  </div>
</div>

<!-- History sheet -->
<div class="overlay" id="historyOverlay">
  <div class="sheet" style="max-height:75vh; overflow-y:auto;">
    <h2>Storico eliminati</h2>
    <div id="historyList"></div>
    <div class="sheet-actions">
      <button class="btn-secondary" id="historyCloseBtn">Chiudi</button>
    </div>
  </div>
</div>

<input type="file" id="fileImportInput" accept=".csv">

<div id="toast">
  <span id="toastMsg"></span>
  <button id="toastUndo">Annulla</button>
</div>

<script>
const SUPABASE_URL = 'https://hqvowaczegebxmkkkhkb.supabase.co/';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imhxdm93YWN6ZWdlYnhta2traGtiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQwMjkwNzgsImV4cCI6MjA5OTYwNTA3OH0.IDAsqv9vYW2IWxONaLb0BcAci5E-BRZ9F4OZUt9uzi0';
const { createClient } = supabase;
const sb = createClient(SUPABASE_URL, SUPABASE_KEY);

let _currentUser = null;
let _events = [];        // eventi attivi (deleted_at null)
let _pendingDeleteTimer = null;
let _pendingDeleteId = null;
let _editingId = null;
let _isSignup = false;

const $ = (id) => document.getElementById(id);

// ---------- UUID ----------
function uuid(){
  return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c=>{
    const r = Math.random()*16|0, v = c==='x'?r:(r&0x3|0x8);
    return v.toString(16);
  });
}

// ---------- Online status ----------
function updateOnlineStatus(){
  $('statusDot').classList.toggle('off', !navigator.onLine);
}
window.addEventListener('online', updateOnlineStatus);
window.addEventListener('offline', updateOnlineStatus);

// ---------- Auth ----------
async function initAuth(){
  const { data: { session } } = await sb.auth.getSession();
  if(session && session.user){
    _currentUser = session.user;
    showApp();
  } else {
    showLogin();
  }
  sb.auth.onAuthStateChange((event, session) => {
    if(session && session.user){
      _currentUser = session.user;
      showApp();
    } else {
      _currentUser = null;
      showLogin();
    }
  });
}

function showLogin(){
  $('loginScreen').style.display = 'flex';
  $('app').classList.add('hidden');
}
function showApp(){
  $('loginScreen').style.display = 'none';
  $('app').classList.remove('hidden');
  $('userEmail').textContent = _currentUser.email;
  updateOnlineStatus();
  loadEvents();
}

$('loginBtn').addEventListener('click', async ()=>{
  const email = $('loginEmail').value.trim();
  const pass = $('loginPass').value;
  $('loginError').textContent = '';
  if(!email || !pass){ $('loginError').textContent = 'Inserisci email e password.'; return; }
  try{
    if(_isSignup){
      const { error } = await sb.auth.signUp({ email, password: pass });
      if(error) throw error;
      $('loginError').style.color = 'var(--ok)';
      $('loginError').textContent = 'Registrato! Controlla la mail se richiesta conferma, poi accedi.';
    } else {
      const { error } = await sb.auth.signInWithPassword({ email, password: pass });
      if(error) throw error;
    }
  }catch(e){
    $('loginError').style.color = 'var(--danger)';
    $('loginError').textContent = e.message || 'Errore di autenticazione.';
  }
});
$('swapToSignup').addEventListener('click', ()=>{
  _isSignup = !_isSignup;
  $('loginBtn').textContent = _isSignup ? 'Registrati' : 'Accedi';
  $('swapToSignup').textContent = _isSignup ? 'Hai già un account? Accedi' : 'Non hai un account? Registrati';
  $('loginError').textContent = '';
});

// ---------- Data loading ----------
async function loadEvents(){
  const { data, error } = await sb.from('events')
    .select('*')
    .eq('user_id', _currentUser.id)
    .is('deleted_at', null)
    .order('date', { ascending:true })
    .order('time', { ascending:true });
  if(error){ console.error(error); return; }
  _events = data || [];
  renderList();
}

async function loadHistory(){
  const { data, error } = await sb.from('events')
    .select('*')
    .eq('user_id', _currentUser.id)
    .not('deleted_at', 'is', null)
    .order('deleted_at', { ascending:false });
  if(error){ console.error(error); return []; }
  return data || [];
}

// ---------- Countdown ----------
function targetDate(ev){
  return new Date(`${ev.date}T${ev.time}`);
}
function formatCountdown(ev){
  const now = new Date();
  const target = targetDate(ev);
  const diffMs = target - now;
  const overdue = diffMs < 0;
  const abs = Math.abs(diffMs);
  const totalHours = abs / 3600000;
  const days = Math.floor(totalHours / 24);
  const hours = Math.floor(totalHours % 24);

  let label, cls = '';
  if(totalHours >= 24*7){
    const d = Math.ceil(totalHours/24);
    label = `${d}g`;
  } else if(totalHours >= 24){
    label = `${days}g ${hours}h`;
    cls = 'urgent';
  } else {
    const h = Math.floor(totalHours);
    const m = Math.round((totalHours - h) * 60);
    label = h > 0 ? `${h}h ${m}m` : `${m}m`;
    cls = 'urgent';
  }
  if(overdue){
    label = (totalHours >= 24 ? `${days}g fa` : `${label} fa`);
    cls = 'overdue';
  }
  return { label, cls };
}

// ---------- Render ----------
function renderList(){
  const c = $('listContainer');
  if(_events.length === 0){
    c.innerHTML = '<div class="empty-state">Nessun appuntamento. Tocca + per aggiungerne uno.</div>';
    return;
  }
  c.innerHTML = _events.map(ev => {
    const { label, cls } = formatCountdown(ev);
    const dateStr = new Date(`${ev.date}T${ev.time}`).toLocaleString('it-IT', {
      day:'2-digit', month:'2-digit', year:'numeric', hour:'2-digit', minute:'2-digit'
    });
    return `
    <div class="event-card" data-id="${ev.id}">
      <div class="event-main">
        <div class="event-name">${escapeHtml(ev.name)}</div>
        <div class="event-date">${dateStr}</div>
      </div>
      <div class="event-countdown ${cls}">${label}</div>
      <div class="event-actions">
        <button class="icon-btn" data-action="dup" title="Duplica">⧉</button>
        <button class="icon-btn" data-action="edit" title="Modifica">✎</button>
        <button class="icon-btn" data-action="del" title="Elimina">🗑</button>
      </div>
    </div>`;
  }).join('');
}
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

// refresh countdown labels every 30s without full reload
setInterval(()=>{ if(_events.length) renderList(); }, 30000);

$('listContainer').addEventListener('click', (e)=>{
  const btn = e.target.closest('.icon-btn');
  if(!btn) return;
  const card = e.target.closest('.event-card');
  const id = card.dataset.id;
  const action = btn.dataset.action;
  const ev = _events.find(x=>x.id===id);
  if(!ev) return;
  if(action === 'edit') openEventForm(ev);
  if(action === 'del') deleteEvent(ev);
  if(action === 'dup') duplicateEvent(ev);
});

// ---------- Event form (create/edit) ----------
function openEventForm(ev){
  _editingId = ev ? ev.id : null;
  $('eventFormTitle').textContent = ev ? 'Modifica appuntamento' : 'Nuovo appuntamento';
  $('fName').value = ev ? ev.name : '';
  $('fDate').value = ev ? ev.date : new Date().toISOString().slice(0,10);
  $('fTime').value = ev ? ev.time.slice(0,5) : '09:00';
  $('eventOverlay').classList.add('show');
}
function closeEventForm(){
  $('eventOverlay').classList.remove('show');
  _editingId = null;
}
$('fabAdd').addEventListener('click', ()=>openEventForm(null));
$('eventCancelBtn').addEventListener('click', closeEventForm);
$('eventOverlay').addEventListener('click', (e)=>{ if(e.target.id==='eventOverlay') closeEventForm(); });

$('eventSaveBtn').addEventListener('click', async ()=>{
  const name = $('fName').value.trim();
  const date = $('fDate').value;
  const time = $('fTime').value;
  if(!name || !date || !time){ alert('Compila tutti i campi.'); return; }

  if(_editingId){
    const { error } = await sb.from('events')
      .update({ name, date, time })
      .eq('id', _editingId)
      .eq('user_id', _currentUser.id);
    if(error){ alert('Errore salvataggio: ' + error.message); return; }
  } else {
    const { error } = await sb.from('events')
      .insert({ id: uuid(), user_id: _currentUser.id, name, date, time });
    if(error){ alert('Errore salvataggio: ' + error.message); return; }
  }
  closeEventForm();
  loadEvents();
});

// ---------- Delete with undo ----------
async function deleteEvent(ev){
  const { error } = await sb.from('events')
    .update({ deleted_at: new Date().toISOString() })
    .eq('id', ev.id)
    .eq('user_id', _currentUser.id);
  if(error){ alert('Errore eliminazione: ' + error.message); return; }
  _events = _events.filter(x=>x.id !== ev.id);
  renderList();
  showUndoToast(`"${ev.name}" eliminato`, ev.id);
}
function showUndoToast(msg, eventId){
  clearTimeout(_pendingDeleteTimer);
  _pendingDeleteId = eventId;
  $('toastMsg').textContent = msg;
  $('toast').classList.add('show');
  _pendingDeleteTimer = setTimeout(()=>{
    $('toast').classList.remove('show');
    _pendingDeleteId = null;
  }, 5000);
}
$('toastUndo').addEventListener('click', async ()=>{
  if(!_pendingDeleteId) return;
  clearTimeout(_pendingDeleteTimer);
  const id = _pendingDeleteId;
  _pendingDeleteId = null;
  $('toast').classList.remove('show');
  const { error } = await sb.from('events')
    .update({ deleted_at: null })
    .eq('id', id)
    .eq('user_id', _currentUser.id);
  if(error){ alert('Errore ripristino: ' + error.message); return; }
  loadEvents();
});

// ---------- Duplicate ----------
async function duplicateEvent(ev){
  const { error } = await sb.from('events')
    .insert({ id: uuid(), user_id: _currentUser.id, name: ev.name + ' (copia)', date: ev.date, time: ev.time });
  if(error){ alert('Errore duplicazione: ' + error.message); return; }
  loadEvents();
}

// ---------- User menu ----------
$('userBox').addEventListener('click', ()=> $('userMenuOverlay').classList.add('show'));
$('userMenuCloseBtn').addEventListener('click', ()=> $('userMenuOverlay').classList.remove('show'));
$('userMenuOverlay').addEventListener('click', (e)=>{ if(e.target.id==='userMenuOverlay') $('userMenuOverlay').classList.remove('show'); });

$('menuLogout').addEventListener('click', async ()=>{
  $('userMenuOverlay').classList.remove('show');
  await sb.auth.signOut();
});

// ---------- History ----------
$('menuHistory').addEventListener('click', async ()=>{
  $('userMenuOverlay').classList.remove('show');
  const items = await loadHistory();
  const list = $('historyList');
  if(items.length === 0){
    list.innerHTML = '<div class="empty-state">Nessun elemento nello storico.</div>';
  } else {
    list.innerHTML = items.map(ev => {
      const delDate = new Date(ev.deleted_at).toLocaleString('it-IT', {day:'2-digit', month:'2-digit', year:'numeric', hour:'2-digit', minute:'2-digit'});
      return `
      <div class="event-card" data-id="${ev.id}">
        <div class="event-main">
          <div class="event-name">${escapeHtml(ev.name)}</div>
          <div class="event-date">${ev.date} ${ev.time.slice(0,5)} <span class="badge-trash">eliminato ${delDate}</span></div>
        </div>
        <div class="event-actions">
          <button class="icon-btn" data-action="restore" title="Ripristina">↩️</button>
        </div>
      </div>`;
    }).join('');
  }
  $('historyOverlay').classList.add('show');
});
$('historyCloseBtn').addEventListener('click', ()=> $('historyOverlay').classList.remove('show'));
$('historyOverlay').addEventListener('click', (e)=>{ if(e.target.id==='historyOverlay') $('historyOverlay').classList.remove('show'); });
$('historyList').addEventListener('click', async (e)=>{
  const btn = e.target.closest('.icon-btn');
  if(!btn) return;
  const card = e.target.closest('.event-card');
  const id = card.dataset.id;
  const { error } = await sb.from('events').update({ deleted_at: null }).eq('id', id).eq('user_id', _currentUser.id);
  if(error){ alert('Errore ripristino: ' + error.message); return; }
  $('historyOverlay').classList.remove('show');
  loadEvents();
});

// ---------- CSV export/import ----------
function csvEscape(s){
  s = String(s ?? '');
  if(/[",\n]/.test(s)) return '"' + s.replace(/"/g,'""') + '"';
  return s;
}
$('menuExport').addEventListener('click', ()=>{
  $('userMenuOverlay').classList.remove('show');
  const rows = [['name','date','time'], ...(_events.map(ev => [ev.name, ev.date, ev.time.slice(0,5)]))];
  const csv = rows.map(r => r.map(csvEscape).join(',')).join('\n');
  const blob = new Blob([csv], { type:'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `nextapp_appuntamenti_${new Date().toISOString().slice(0,10)}.csv`;
  a.click();
  URL.revokeObjectURL(url);
});

$('menuImport').addEventListener('click', ()=>{
  $('userMenuOverlay').classList.remove('show');
  $('fileImportInput').click();
});
$('fileImportInput').addEventListener('change', async (e)=>{
  const file = e.target.files[0];
  if(!file) return;
  const text = await file.text();
  const lines = text.split(/\r?\n/).filter(l => l.trim().length);
  if(lines.length < 2){ alert('CSV vuoto o non valido.'); return; }
  const header = lines[0].split(',').map(h=>h.trim().toLowerCase());
  const idxName = header.indexOf('name');
  const idxDate = header.indexOf('date');
  const idxTime = header.indexOf('time');
  if(idxName === -1 || idxDate === -1 || idxTime === -1){
    alert('Il CSV deve avere le colonne: name,date,time');
    return;
  }
  const toInsert = [];
  for(let i=1;i<lines.length;i++){
    const cols = parseCsvLine(lines[i]);
    if(cols.length < 3) continue;
    const name = cols[idxName]?.trim();
    const date = cols[idxDate]?.trim();
    const time = cols[idxTime]?.trim();
    if(!name || !date || !time) continue;
    toInsert.push({ id: uuid(), user_id: _currentUser.id, name, date, time: time.length===5? time+':00': time });
  }
  if(toInsert.length === 0){ alert('Nessuna riga valida trovata.'); return; }
  const { error } = await sb.from('events').insert(toInsert);
  if(error){ alert('Errore importazione: ' + error.message); return; }
  alert(`${toInsert.length} appuntamenti importati.`);
  loadEvents();
  e.target.value = '';
});
function parseCsvLine(line){
  const out = []; let cur=''; let inQ=false;
  for(let i=0;i<line.length;i++){
    const c = line[i];
    if(inQ){
      if(c === '"'){
        if(line[i+1] === '"'){ cur+='"'; i++; } else inQ=false;
      } else cur += c;
    } else {
      if(c === '"') inQ = true;
      else if(c === ','){ out.push(cur); cur=''; }
      else cur += c;
    }
  }
  out.push(cur);
  return out;
}

// ---------- Service worker ----------
if('serviceWorker' in navigator){
  window.addEventListener('load', ()=> navigator.serviceWorker.register('sw.js').catch(()=>{}));
}

initAuth();
